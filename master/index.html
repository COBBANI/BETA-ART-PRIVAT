<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BETA ART Master</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f5f5f5}body{margin:0;padding:32px}.wrap{max-width:1100px;margin:auto}.hero{background:#111;color:#fff;border-radius:18px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:#ccc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}.id{font-size:12px;font-weight:700;letter-spacing:.08em;color:#666}.name{font-size:20px;font-weight:750;margin:6px 0 10px}.meta{font-size:14px;line-height:1.55;color:#444}.badge{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px}.foot{margin-top:22px;color:#666;font-size:13px}.error{padding:16px;background:#fff3f3;border:1px solid #ffc9c9;border-radius:12px}</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>BETA ART Master</h1>
    <p>beta-art-master için merkezi proje ve arşiv paneli</p>
  </section>
  <p id="sync-status" role="status">Proje kayıtları yükleniyor…</p>
  <p><a href="https://vercel.com/beta-art-master">Vercel alanını aç</a> · <a href="https://github.com/andersenbetul-alt/BETA-ART-PRIVAT/pull/26">GitHub güncellemesini incele</a></p>
  <div id="projects" class="grid"></div>
  <div class="foot">Kaynak: <code>master/projects.json</code> · Production branch: <code>main</code></div>
</main>
<script>
fetch('./projects.json').then(r=>{if(!r.ok)throw new Error('Inventory unavailable');return r.json();}).then(data=>{
  document.getElementById('sync-status').textContent='Son erişim kontrolü: '+data.lastAccessCheck.date+' · Hedef Vercel alanına erişim doğrulanamadı. Canlı yayın doğrulanamadı.';
  const root=document.getElementById('projects');
  data.projects.forEach(p=>{
    const el=document.createElement('article');el.className='card';
    el.innerHTML=`<div class="id">${p.archiveId}</div><div class="name">${p.name}</div><div class="meta"><b>Vercel:</b> ${p.vercelProject||'—'}<br><b>Repo:</b> ${p.repository||'—'}<br><b>Domain:</b> ${p.domain||'—'}<br><b>Root:</b> ${p.rootDirectory||'—'}</div><span class="badge">${p.status}</span>`;
    root.appendChild(el);
  });
}).catch(()=>document.getElementById('projects').innerHTML='<div class="error">projects.json yüklenemedi.</div>');
</script>
</body>
</html>
