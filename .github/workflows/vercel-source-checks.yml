name: Vercel source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check existing content and local references
        run: node scripts/check.mjs
      - name: Verify the Vercel build script is included in uploads
        shell: bash
        run: |
          if git -c core.excludesFile=.vercelignore check-ignore --no-index --quiet scripts/vercel-build.sh; then
            echo 'The Vercel build script is excluded from the source upload.' >&2
            exit 1
          fi
      - name: Check clean builds, public configuration, and script policies
        run: node --test scripts/deployment.test.mjs
      - name: Build the static deployment
        run: bash scripts/vercel-build.sh
      - name: Check panel and membership application syntax
        run: |
          node --check panel/app.js
          node --check uye/app.js

  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/eve-chat-template
    services:
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install the declared package manager
        run: npm install --global pnpm@10.12.4
      - name: Install the locked application dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test password login and session protection
        run: pnpm test
      - name: Verify real Redis expiry, concurrency, and SDK failures
        run: pnpm test:redis
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - name: Check application types
        run: pnpm typecheck
      - name: Build the embedded Next.js application
        run: pnpm build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Test panel, built membership, and master in Chromium
        run: node scripts/browser-smoke.mjs
