name: Master dashboard checks
on:
  push:
    branches: [main]
    paths: ["master/**", ".github/workflows/master-checks.yml"]
  pull_request:
    paths: ["master/**", ".github/workflows/master-checks.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: master-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Check inventory, export safety and isolated build
        run: node --test master/tests/dashboard.test.mjs
      - name: Build and check browser modules
        run: |
          node master/build.mjs
          node --check master/app.mjs
          node --check master/data.mjs
